[build]
  command   = "npm run build"
  publish   = "dist"

# SPA rewrite — every path serves index.html so React Router handles routing
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache immutable hashed assets forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache the service worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
